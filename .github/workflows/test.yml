name: Test PostgreSQL environment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17', '18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test SQL, persistence and backup round trip
        shell: pwsh
        run: ./tests/integration.Tests.ps1 -Version '${{ matrix.postgres }}'

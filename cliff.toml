# Release notes and downloadable CHANGELOG.md share this exact content.
[changelog]
header = "# Changelog\n\n"
body = """
## {{ version }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING CHANGE:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% if commit.breaking_description %}  {{ commit.breaking_description }}
{% endif %}{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
sort_commits = "oldest"
commit_parsers = [
    { message = '^feat(\([^)]*\))?!?:', group = "Features" },
    { message = '^fix(\([^)]*\))?!?:', group = "Fixes" },
    { message = '^docs(\([^)]*\))?!?:', group = "Documentation" },
    { message = '^perf(\([^)]*\))?!?:', group = "Performance" },
    { message = '^refactor(\([^)]*\))?!?:', group = "Refactoring" },
    { message = '^test(\([^)]*\))?!?:', group = "Tests" },
    { message = '^build(\([^)]*\))?!?:', group = "Build" },
    { message = '^ci(\([^)]*\))?!?:', group = "CI" },
    { message = '^chore(\([^)]*\))?!?:', group = "Maintenance" },
    { message = '^style(\([^)]*\))?!?:', group = "Style" },
    { message = '^revert(\([^)]*\))?!?:', group = "Reverts" },
    { message = ".*", group = "Other" },
]
